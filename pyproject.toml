[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-workspace"
version = "0.1.1"
license = {text = "MIT"}
description = "버전을 고정한 SENTINEL 언어 도구를 연결하는 로컬 통합 실행기"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sentinel = ["admission.json"]
