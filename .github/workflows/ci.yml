# 통합 실행기 자체 시험과 승인 목록 검증. 표준 라이브러리만 쓰므로 Python 하나면 된다.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the unified runner's tests
        run: PYTHONPATH=src python3 -B -m unittest discover -s tests -v
      - name: Validate the plugin manifests
        run: |
          python3 -c "import json; json.load(open('.claude-plugin/marketplace.json')); json.load(open('.agents/plugins/marketplace.json')); json.load(open('plugins/sentinel/.claude-plugin/plugin.json')); json.load(open('plugins/sentinel/.codex-plugin/plugin.json'))"
      - name: Lint the admission list (offline)
        run: python3 scripts/admission.py lint
      - name: Verify the admission list against GitHub
        # The language repositories are public, so the workflow's own token can read them.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/admission.py verify

  compatibility:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: "3.9"
          - os: ubuntu-24.04-arm
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify the runner across Python versions and CPU architectures
        run: PYTHONPATH=src python3 -B -m unittest discover -s tests -v

  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify supported commands and atomic installation
        env:
          PYTHONPATH: src:tests
        run: |
          export TMPDIR="$(python3 -c 'import pathlib,tempfile; print(pathlib.Path(tempfile.gettempdir()).resolve())')"
          python3 -B -m unittest test_bundle_publication test_cli test_setup test_admission test_changed test_gate test_selection test_execution_mode test_host_plugin test_protocol_entrypoint test_docs_lint tests.test_review_fixes.InstallReviewTests tests.test_review_fixes.InputReviewTests -v
      - name: Install and exercise admitted Python, TypeScript and Java tools
        run: python3 -B scripts/verify_native.py --output "$RUNNER_TEMP/sentinel-native"
      - name: Save native verification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/sentinel-native/*/*.json
            ${{ runner.temp }}/sentinel-native/*/*.stderr
